# E2B Cloud template for local Kortix sessions.
# The E2B CLI cannot build this: apps/sandbox/Dockerfile is multi-stage and
# E2B CLI 2.x rejects multi-stage Dockerfiles. The API snapshot builder
# (apps/api/src/snapshots/providers/e2b.ts) builds the E2B template instead,
# so leave E2B_TEMPLATE empty in apps/api/.env.local.

dockerfile = "Dockerfile"
template_name = "kortix-sandbox"
template_id = "kortix-sandbox"
cpu_count = 2
memory_mb = 4096
start_cmd = "sleep infinity"
